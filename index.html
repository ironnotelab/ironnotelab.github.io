<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encarta · IronNote Lab</title>
<meta name="description" content="Encarta — AI strategy and hands-on AI notes.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--ink:#222;--muted:#666;--line:#e5e5e5;--link:#1a5fb4;--bg:#fff}
  @media (prefers-color-scheme:dark){:root{--ink:#e6e6e6;--muted:#999;--line:#333;--link:#78aeed;--bg:#161616}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
  main{max-width:760px;margin:0 auto;padding:64px 24px 40px}
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}

  .profile{display:flex;gap:28px;align-items:center;margin-bottom:44px}
  .avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#ddd}
  .avatar.fallback{display:grid;place-items:center;font-size:40px;font-weight:700;color:#fff;background:#3a3f47}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
  .affil{color:var(--muted);margin-top:4px}
  .links{margin-top:8px;font-size:15px}
  .links a+a::before{content:"·";color:var(--muted);margin:0 8px}

  h2{font-size:20px;font-weight:700;margin:40px 0 14px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  p{margin-bottom:12px;word-break:keep-all}
  ul{list-style:none}
  li{margin-bottom:10px;word-break:keep-all}
  .date{display:inline-block;min-width:82px;font-weight:600}
  .row{display:flex;justify-content:space-between;gap:16px}
  .row span{color:var(--muted);white-space:nowrap;font-size:15px}
  .sub{color:var(--muted);font-size:15px}
  .proj li{padding-left:0}
  .proj b{font-weight:600}
  footer{max-width:760px;margin:0 auto;padding:24px 24px 56px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
  @media (max-width:560px){.profile{flex-direction:column;align-items:flex-start;gap:18px}.avatar{width:96px;height:96px}.row{flex-direction:column;gap:0}}
</style>
</head>
<body>
<main>

  <header class="profile">
    <img class="avatar" src="photo.jpg" alt="Encarta"
      onerror="this.outerHTML='<div class=&quot;avatar fallback&quot;>E</div>'">
    <div>
      <h1>Encarta</h1>
      <div class="affil">AI Strategy · IronNote Lab</div>
      <div class="links">
        <a href="https://github.com/ironnotelab">GitHub</a>
        <a href="https://github.com/ironnotelab/ChulCode.github.io">Blog</a>
      </div>
    </div>
  </header>

  <section>
    <h2>About</h2>
    <p>AI 전략 기획 분야에서 일하고 있습니다. 생성형 AI 제품 기획자이자 콘텐츠 크리에이터, 저자로도 활동합니다.</p>
    <p>오랫동안 AI 프로젝트를 기획해 왔지만, “가르치려면 먼저 만들어 봐야 한다”는 생각으로 <b>LLM, RAG, Agent</b>를 직접 구현하며 배운 것을 <b>IronNote Lab</b>에 기록하고 있습니다.</p>
  </section>

  <section>
    <h2>News</h2>
  </section>

  <section>
    <h2>Projects</h2>
  </section>

  <section>
    <h2>Education</h2>
  </section>

</main>
<footer>© 2026 Encarta · Last updated: November 2026</footer>
</body>
</html>
